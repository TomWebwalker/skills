name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check plugin versions match package.json
        run: npm run check-plugin-version

      - name: Check skill paths and invocation flags
        run: npm run check-plugin-layout

      - name: Validate Claude marketplace / plugin
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
